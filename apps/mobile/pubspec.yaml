name: nearlink
description: Whisplot, an invite-only encrypted group chat app.
publish_to: none
version: 0.1.0+18
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  sqflite: ^2.4.6
  sqflite_common_ffi: ^2.4.7
  path: ^1.9.1
  flutter_webrtc: ^1.6.3
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  uuid: ^4.6.0
  material_ui: ^1.11.1
  record: 7.2.0
  audioplayers: 6.8.1
  path_provider: ^2.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_logo.png
    - assets/emojis/72x72/
    - assets/emojis/licenses/

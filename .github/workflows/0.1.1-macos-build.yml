          from hashlib import sha256
          import json, sys, zlib
          from pathlib import Path

          files = json.loads(zlib.decompress(Path(sys.argv[1]).read_bytes()))
          for filename, (expected_base, expected_result, edits) in files.items():
              path = Path(filename)
              assert not path.is_absolute() and '..' not in path.parts
              original = path.read_bytes() if path.exists() else b''
              assert sha256(original).hexdigest() == expected_base, filename
              lines = original.decode().splitlines(True)
              for start, end, replacement in reversed(edits):
                  lines[start:end] = [replacement]
              result = ''.join(lines).encode()
              assert sha256(result).hexdigest() == expected_result, filename
              path.write_bytes(result)
          PY

          (
            cd apps/mobile
            flutter pub get
            flutter build macos --release --no-pub --dart-define-from-file="$RUNNER_TEMP/staging-defines.json"
          )
          app="apps/mobile/build/macos/Build/Products/Release/Whisplot.app"
          python3 scripts/build_config.py verify --define-file "$RUNNER_TEMP/staging-defines.json" \
            --binary "$app/Contents/Frameworks/App.framework/Versions/A/App"
          oldzip="$RUNNER_TEMP/whisplot-0.4.1.zip"
          curl -fsSL --retry 2 --max-time 120 'https://github.com/whisplot/whisplot-client/releases/download/v0.1.0/whisplot-0.1.0-build18-macos-universal2.zip' -o "$oldzip"
          printf '%s  %s\n' '5facd34502630b51a28e7e48e316c0f783098ef4f801d7027da4915cb480435c' "$oldzip" | shasum -a 256 -c -
          ditto -x -k "$oldzip" "$RUNNER_TEMP/old"
          mkdir staging
          python3 - "$app" <<'PY'
          import hashlib, os, plistlib, subprocess, sys
          from pathlib import Path

          old = Path(os.environ['RUNNER_TEMP']) / 'old/Whisplot.app'
          app = Path(sys.argv[1])
          helper = 'Contents/XPCServices/HelloMentorVaultService.xpc'
          helper_executable = 'Contents/MacOS/HelloMentorVaultService'
          signer = '778a1e14354a52cddf47c339728215c0ee86ea52'
          old_info = plistlib.loads((old / 'Contents/Info.plist').read_bytes())
          path = app / 'Contents/Info.plist'
          info = plistlib.loads(path.read_bytes())
          if info['CFBundleIdentifier'] != old_info['CFBundleIdentifier'] or info['CFBundleVersion'] != '19' or info['CFBundleShortVersionString'] != '0.1.1':
              raise ValueError('Unexpected Mac bundle identity or build')
          req = old_info['HMVaultServiceSigningRequirement']
          if req != f'identifier "com.nearlink.chat.VaultService" and certificate leaf = H"{signer}"':
              raise ValueError('Unexpected original helper requirement')
          if not old_info['HMUsesStableVaultService']:
              raise ValueError('The original release did not enable the expected helper')
          info['HMUsesStableVaultService'] = True
          info['HMVaultServiceSigningRequirement'] = req
          path.write_bytes(plistlib.dumps(info, sort_keys=False))
          (app / helper).parent.mkdir(exist_ok=True)
          subprocess.run(['ditto', old / helper, app / helper], check=True)
          if hashlib.sha256((app / helper / helper_executable).read_bytes()).hexdigest() != '2d78bba6972075ed3989ab4044c2d6c63e2ab54beac02a88e9ad3b7776938385':
              raise ValueError('Original signed helper differs')
          requirements = subprocess.run(
              ['codesign', '-d', '-r-', old], capture_output=True, check=True
          )
          text = (requirements.stdout + requirements.stderr).decode()
          designated = next(line for line in text.splitlines() if line.startswith('designated =>'))
          expected = f'identifier "com.nearlink.chat" and certificate leaf = H"{signer}"'
          if designated.partition('=>')[2].strip().lower() != expected.lower():
              raise ValueError('Original outer app designated requirement differs')
          subprocess.run(['csreq', '-r', '=' + expected, '-b', 'staging/app-requirements.bin'], check=True)
          for path, out in ((old, 'staging/app-entitlements.plist'),
                            (app, 'staging/built-entitlements.plist')):
              body = subprocess.run(['codesign', '-d', '--entitlements', '-', '--xml', path],
                                    capture_output=True, check=True).stdout
              Path(out).write_bytes(body)
          if plistlib.loads(Path('staging/app-entitlements.plist').read_bytes()) != plistlib.loads(Path('staging/built-entitlements.plist').read_bytes()):
              raise ValueError('Mac entitlements differ from the old release')
          Path('staging/built-entitlements.plist').unlink()
          PY
          codesign --force --sign - --preserve-metadata=entitlements,flags "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" staging/whisplot-macos-local-signing-input.zip
          (cd staging && shasum -a 256 *.zip *.bin *.plist > SHA256SUMS.txt)
          codesign --verify --deep --strict "$app"
          while IFS= read -r -d '' binary; do
            if file -b "$binary" | grep -q 'Mach-O'; then
              archs="$(lipo -archs "$binary")"
              [[ " $archs " == *' x86_64 '* && " $archs " == *' arm64 '* ]]
            fi
          done < <(find "$app" -type f -print0)
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('staging/whisplot-macos-local-signing-input.zip') != '' }}
        with:
          name: whisplot-0.1.1-build19-macos-local-signing-input
          path: staging/
          retention-days: 3
          if-no-files-found: error

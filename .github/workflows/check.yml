name: Validate prototype
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --target-platform android-arm64 --split-per-abi
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - run: flutter analyze
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile
      - run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: whisplot-windows-x64
          path: artifacts/Whisplot-*-windows-x64.zip*
          if-no-files-found: error
          retention-days: 7
